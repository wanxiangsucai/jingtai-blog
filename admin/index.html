<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>万象静态博客系统 · 后台</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--line:#e5e9f1;--ink:#1c2331;--ink2:#5c6675;--ink3:#8b95a7;--brand:#1d4ed8;--brand2:#eff4ff;--red:#d64545;--green:#12946a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--brand);text-decoration:none}
.layout{display:flex;min-height:100vh}
/* 侧栏 */
.side{width:212px;flex:0 0 212px;background:#101827;color:#cdd5e3;padding:18px 0;position:sticky;top:0;height:100vh}
.side .brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.side .brand b{display:block;color:#fff;font-size:16px;letter-spacing:.5px}
.side .brand span{font-size:12px;color:#7c8798}
.side a.navitem{display:flex;align-items:center;gap:9px;padding:10px 20px;color:#c3ccdb;font-size:14px;cursor:pointer}
.side a.navitem:hover{background:rgba(255,255,255,.06);color:#fff}
.side a.navitem.on{background:var(--brand);color:#fff;font-weight:600}
.side .dot{width:6px;height:6px;border-radius:50%;background:#4b5c74}
.side a.navitem.on .dot{background:#fff}
.side .foot2{position:absolute;bottom:16px;left:0;right:0;text-align:center;font-size:12px;color:#5f6a7c}
/* 主区 */
.main{flex:1;min-width:0;padding:22px 26px 60px}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.topbar h1{font-size:19px;margin:0}
.topbar .spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;font-size:13.5px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#b9c3d6}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#1a43bd}
.btn.danger{color:var(--red);border-color:#f3cccc}
.btn.danger:hover{background:#fff4f4}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:18px}
.card h2{font-size:15px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.card h2 .bar{width:3px;height:14px;background:var(--brand);border-radius:2px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{font-size:24px;display:block;line-height:1.2}
.stat span{color:var(--ink3);font-size:12.5px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
th{color:var(--ink3);font-weight:500;font-size:12.5px;background:#fafbfd}
tr:hover td{background:#fafbfd}
td .t{font-weight:600;color:var(--ink)}
td .s{color:var(--ink3);font-size:12px}
label.f{display:block;margin-bottom:13px}
label.f>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);background:#fff;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--brand)}
textarea{min-height:90px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{color:var(--ink3);font-size:12px;margin-top:3px}
.msg{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:#101827;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
.msg.on{opacity:1}
.msg.err{background:#b63636}
/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(16,24,39,.45);display:none;align-items:center;justify-content:center;z-index:30;padding:20px}
.mask.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(860px,96vw);max-height:92vh;overflow:auto;padding:22px 24px}
.modal h3{margin:0 0 16px;font-size:16px}
.modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--brand2);color:var(--brand);border-radius:999px;padding:3px 10px;font-size:12.5px}
.empty{color:var(--ink3);padding:18px 0;text-align:center}
/* 模板卡片 */
.tplgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:14px}
@media(max-width:1100px){.tplgrid{grid-template-columns:1fr}}
.tplcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.tplcard.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(29,78,216,.12)}
.tplshot{height:112px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;letter-spacing:.5px;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.tplshot span{max-width:86%;text-align:center}
.tplbody{padding:14px 15px 15px;display:flex;flex-direction:column;gap:6px;flex:1}
.tplbody h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tplbody p{margin:0 0 4px;color:var(--ink3);font-size:12.5px;line-height:1.6}
.tplacts{margin-top:auto;display:flex;gap:8px;align-items:center}
.pill{font-style:normal;font-size:11.5px;padding:1px 8px;border-radius:999px;background:#eef2ff;color:var(--brand)}
.pill.on{background:var(--brand);color:#fff}
@media(max-width:900px){.layout{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;align-items:center;padding:10px}.side .brand{border:0;padding:6px 14px;margin:0}.side a.navitem{padding:8px 12px}.side .foot2{display:none}.grid4{grid-template-columns:1fr 1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
  <aside class="side">
    <div class="brand"><b id="side-name">万象静态博客</b><span>万象静态博客系统 · 后台</span></div>
    <a class="navitem on" data-v="dash"><i class="dot"></i>概览</a>
    <a class="navitem" data-v="settings"><i class="dot"></i>网站设置</a>
    <a class="navitem" data-v="template"><i class="dot"></i>模板管理</a>
    <a class="navitem" data-v="lanmu"><i class="dot"></i>栏目管理</a>
    <a class="navitem" data-v="tags"><i class="dot"></i>标签管理</a>
    <a class="navitem" data-v="article"><i class="dot"></i>文章管理</a>
    <a class="navitem" data-v="links"><i class="dot"></i>友情链接</a>
    <div class="foot2">© 万象静态博客系统</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <h1 id="page-title">概览</h1>
      <div class="spacer"></div>
      <a class="btn" id="open-site" href="/" target="_blank">打开站点</a>
      <button class="btn" onclick="act('rebuild')">重建全站</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div class="msg" id="msg"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>

<script>
var S = { token: '', settings: {}, article: [], lanmu: [], tags: [], links: [], cur: 'dash', editing: null };

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function slug(s){ return String(s==null?'':s).trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'') || 'lanmu'; }
function catUrl(id){ return '/' + slug(id) + '/'; }
function postUrl(a){ return '/' + slug(a.cid) + '/' + a.id + '.html'; }
function toast(text, err){
  var m=$('msg'); m.textContent=text; m.className='msg on'+(err?' err':'');
  clearTimeout(m._t); m._t=setTimeout(function(){ m.className='msg'+(err?' err':''); }, 2200);
}
function mask(on, html){ var k=$('mask'); if(on){ $('modal').innerHTML=html; k.classList.add('on'); } else k.classList.remove('on'); }

function api(path, body){
  var opt = body ? { method:'POST', headers:{'Content-Type':'application/json','X-Token':S.token}, body: JSON.stringify(Object.assign({token:S.token}, body)) }
                 : { headers:{'X-Token':S.token} };
  return fetch(path, opt).then(function(r){ return r.json().then(function(j){ if(r.status===401) throw new Error('密钥不对，请点右上角「密钥」重新填'); if(j.code===1) throw new Error(j.msg||'失败'); return j; }); });
}
function fail(e){ toast(e.message||'出错了', true); }

// ---------------- 概览 ----------------
function viewDash(){
  var arts = S.article.slice().sort(function(a,b){ return b.created-a.created; });
  return `
  <div class="grid4">
    <div class="stat"><b>${arts.length}</b><span>文章总数</span></div>
    <div class="stat"><b>${S.lanmu.length}</b><span>栏目数</span></div>
    <div class="stat"><b>${S.tags.length}</b><span>标签数</span></div>
    <div class="stat"><b>${S.links.length}</b><span>友情链接</span></div>
    <div class="stat"><b>${S.settings.domain ? '已绑定' : '未绑定'}</b><span>网站域名</span></div>
  </div>
  <div class="card"><h2><i class="bar"></i>最近发布</h2>
    ${arts.length ? `<table><thead><tr><th>标题</th><th>栏目</th><th>时间</th><th style="width:120px"></th></tr></thead><tbody>
      ${arts.slice(0,8).map(function(a){ return `<tr><td><div class="t">${esc(a.title)}</div><div class="s">${esc(postUrl(a))}</div></td><td>${esc(lanmuName(a.cid))}</td><td class="s">${fmt(a.created)}</td><td><a class="btn sm" href="${esc(postUrl(a))}" target="_blank">查看</a></td></tr>`; }).join('')}
    </tbody></table>` : '<div class="empty">还没有文章。右边「文章管理」可以手写，写稿工具也能直接发。</div>'}
  </div>
  <div class="card"><h2><i class="bar"></i>怎么接写稿工具</h2>
    <p class="hint" style="font-size:13px;line-height:1.9">
      写稿工具「批量站点管理」里新建站点：类型选 <b>静态站系统</b>，接口地址 <code>${esc(location.origin)}</code>，密钥填 <code>${esc(S.token)}</code>，然后同步栏目 → 测试发布。<br>
      接口说明：<code>GET /api/lanmus</code> 读栏目、<code>POST /api/publish</code> 发文、<code>POST /api/article/save</code> 改文章。
    </p>
  </div>`;
}

// ---------------- 网站设置 ----------------
function viewSettings(){
  var s = S.settings;
  return `<div class="card"><h2><i class="bar"></i>基本设置</h2>
    <div class="row2">
      <label class="f"><span>网站名称</span><input type="text" id="s-name" value="${esc(s.site_name||'')}"><div class="hint">显示在页头 logo 与页脚</div></label>
      <label class="f"><span>网站域名</span><input type="text" id="s-domain" value="${esc(s.domain||'')}" placeholder="https://www.example.com"><div class="hint">填了才会生成绝对 canonical 与 sitemap 域名，末尾不要带 /</div></label>
    </div>
    <label class="f"><span>站点副标题（简介）</span><input type="text" id="s-desc" value="${esc(s.site_desc||'')}" placeholder="一句话介绍这个站"></label>
    <div class="card" style="background:#fafbfd;margin:0 0 16px;padding:14px 16px">
      <h2 style="margin-bottom:12px"><i class="bar"></i>首页 SEO</h2>
      <label class="f"><span>SEO 标题</span><input type="text" id="s-seo-title" value="${esc(s.seo_title||'')}" placeholder="留空则用「网站名称 - 副标题」"></label>
      <label class="f"><span>SEO 关键词</span><input type="text" id="s-seo-keywords" value="${esc(s.seo_keywords||'')}" placeholder="逗号分隔，例如：新闻,技术,资源"></label>
      <label class="f" style="margin-bottom:0"><span>SEO 描述</span><textarea id="s-seo-desc" style="min-height:70px" placeholder="80~150 字，写清这个站讲什么">${esc(s.seo_desc||'')}</textarea></label>
    </div>
    <div class="row2">
      <label class="f"><span>统计代码</span><textarea id="s-analytics" style="min-height:120px;font-family:Consolas,monospace;font-size:12.5px" placeholder="整段 &lt;script&gt; 粘进来，例如百度统计/CNZZ/Google Analytics">${esc(s.analytics||'')}</textarea><div class="hint">原样插到每个页面 &lt;/body&gt; 前</div></label>
      <div>
        <label class="f"><span>备案号</span><input type="text" id="s-icp" value="${esc(s.icp||'')}" placeholder="冀ICP备xxxxxxxx号-1"><div class="hint">填了页脚会带备案链接</div></label>
        <div class="row2">
          <label class="f"><span>品牌色</span><input type="text" id="s-brand" value="${esc(s.brand||'#1d4ed8')}" placeholder="#1d4ed8"></label>
          <label class="f"><span>首页每页条数</span><input type="number" id="s-per" value="${esc(s.per_page||20)}" min="3" max="60"></label>
        </div>
      </div>
    </div>
    <button class="btn primary" onclick="saveSettings()">保存设置并重建</button>
  </div>`;
}

function saveSettings(){
  api('/api/settings/save', {
    site_name: $('s-name').value.trim(),
    site_desc: $('s-desc').value.trim(),
    seo_title: $('s-seo-title').value.trim(),
    seo_keywords: $('s-seo-keywords').value.trim(),
    seo_desc: $('s-seo-desc').value.trim(),
    domain: $('s-domain').value.trim(),
    analytics: $('s-analytics').value,
    icp: $('s-icp').value.trim(),
    brand: $('s-brand').value.trim() || '#1d4ed8',
    per_page: parseInt($('s-per').value, 10) || 20,
  }).then(function(j){ toast(j.msg); reload().then(function(){ go('settings'); }); }).catch(fail);
}
function loadSettings(){
  return api('/api/settings').then(function(j){ S.settings = j.settings; S.lanmu = j.settings.lanmus||[]; S.links = j.settings.links||[]; $('side-name').textContent = S.settings.site_name||'静态站'; document.title = (S.settings.site_name||'静态站')+' · 后台'; });
}

// ---------------- 栏目 ----------------
function viewLanmu(){
  return `<div class="card"><h2><i class="bar"></i>新增栏目</h2>
    <div class="row2" style="grid-template-columns:200px 1fr auto;align-items:end">
      <label class="f" style="margin:0"><span>栏目 id</span><input type="text" id="lm-id" placeholder="news"></label>
      <label class="f" style="margin:0"><span>栏目名称</span><input type="text" id="lm-title" placeholder="新闻动态"></label>
      <button class="btn primary" style="height:36px" onclick="addLanmu()">添加</button>
    </div>
    <div class="hint">id 会进 URL（栏目页 <code>/news/</code>、文章页 <code>/news/00000001.html</code>），建好后尽量别改；改 id 会自动把该栏目文章的归属和目录一起改掉。</div>
  </div>
  <div class="card"><h2><i class="bar"></i>栏目列表</h2>
    ${S.lanmu.length ? `<table><thead><tr><th style="width:140px">id</th><th>栏目名称</th><th style="width:100px">文章数</th><th style="width:190px">操作</th></tr></thead><tbody>
      ${S.lanmu.map(function(l, i){ return `<tr><td><code>${esc(l.id)}</code></td><td class="t">${esc(l.title)}</td><td class="s">${countOf(l.id)}</td>
      <td><a class="btn sm" href="${esc(catUrl(l.id))}" target="_blank">查看</a>
      <button class="btn sm" onclick="editLanmu(${i})">修改</button>
      <button class="btn sm danger" onclick="delLanmu('${esc(l.id)}')">删除</button></td></tr>`; }).join('')}
    </tbody></table>` : '<div class="empty">还没有栏目，上面加一个。</div>'}
  </div>`;
}
function countOf(cid){ return S.article.filter(function(a){ return String(a.cid)===String(cid); }).length; }
function lanmuName(cid){ for(var i=0;i<S.lanmu.length;i++){ if(String(S.lanmu[i].id)===String(cid)) return S.lanmu[i].title; } return '未分类'; }
function addLanmu(){
  api('/api/lanmu/save', { id:$('lm-id').value.trim(), title:$('lm-title').value.trim() })
    .then(function(j){ toast(j.msg); reload().then(function(){ go('lanmu'); }); }).catch(fail);
}
function editLanmu(i){
  var l = S.lanmu[i];
  mask(true, `<h3>修改栏目</h3>
    <label class="f"><span>栏目 id（会改 URL，慎重）</span><input type="text" id="e-id" value="${esc(l.id)}"></label>
    <label class="f"><span>栏目名称</span><input type="text" id="e-title" value="${esc(l.title)}"></label>
    <div class="actions"><button class="btn" onclick="mask(false)">取消</button><button class="btn primary" onclick="doEditLanmu('${esc(l.id)}')">保存</button></div>`);
}
function doEditLanmu(oldId){
  api('/api/lanmu/save', { oldId: oldId, id:$('e-id').value.trim(), title:$('e-title').value.trim() })
    .then(function(j){ mask(false); toast(j.msg); reload().then(function(){ go('lanmu'); }); }).catch(fail);
}
function delLanmu(id){
  if(!confirm('删除栏目「'+lanmuName(id)+'」？该栏目下的文章会保留（显示未分类）。')) return;
  api('/api/lanmu/del', { id:id }).then(function(j){ toast(j.msg); reload().then(function(){ go('lanmu'); }); }).catch(fail);
}

// ---------------- 标签 ----------------
function viewTags(){
  var base = S.settings.domain || '';
  return `<div class="card"><h2><i class="bar"></i>添加标签</h2>
    <div class="row2" style="grid-template-columns:1fr 1fr auto auto;align-items:end">
      <label class="f" style="margin:0"><span>标签名称</span><input type="text" id="tg-title" placeholder="人工智能" oninput="suggestTagId()"></label>
      <label class="f" style="margin:0"><span>标签 id（拼音，会进 URL）</span><input type="text" id="tg-id" placeholder="rengongzhineng"></label>
      <button class="btn" style="height:36px" onclick="fillTagId()">用拼音生成</button>
      <button class="btn primary" style="height:36px" onclick="addTag()">添加</button>
    </div>
    <div class="hint">中文标签 id 取全拼，英文标签 id 就是它本身（小写）。链接形式 <code>域名/标签id.html</code>，例如 <code>${esc((base || '') + '/rengongzhineng.html')}</code>；页面和栏目页一个样式。</div>
  </div>
  <div class="card"><h2><i class="bar"></i>标签列表 <span class="chip">${S.tags.length} 个</span></h2>
    ${S.tags.length ? `<table><thead><tr><th style="width:170px">id</th><th>标签名称</th><th style="width:90px">文章数</th><th style="width:190px">操作</th></tr></thead><tbody>
      ${S.tags.map(function(t, i){ return `<tr><td><code>${esc(t.id)}</code></td><td class="t">${esc(t.title)}</td><td class="s">${tagCount(t.id)}</td>
      <td><a class="btn sm" href="${esc(tagUrl(t.id))}" target="_blank">查看</a>
      <button class="btn sm" onclick="editTag(${i})">修改</button>
      <button class="btn sm danger" onclick="delTag('${esc(t.id)}')">删除</button></td></tr>`; }).join('')}
    </tbody></table>` : '<div class="empty">还没有标签。发文时在「标签」里填逗号隔开的名字，也会自动建。</div>'}
  </div>`;
}
function tagCount(id){ return S.article.filter(function(a){ return (a.tags||[]).indexOf(id)>=0; }).length; }
function tagUrl(id){ return '/' + slug(id) + '.html'; }
function suggestTagId(){
  clearTimeout(window._tgT);
  window._tgT = setTimeout(fillTagId, 500);
}
function fillTagId(){
  var name = $('tg-title').value.trim();
  if(!name){ $('tg-id').value=''; return; }
  api('/api/tagid?name=' + encodeURIComponent(name)).then(function(j){ $('tg-id').value = j.id; }).catch(function(e){});
}
function addTag(){
  api('/api/tag/save', { title:$('tg-title').value.trim(), id:$('tg-id').value.trim() })
    .then(function(j){ toast(j.msg); reload().then(function(){ go('tags'); }); }).catch(fail);
}
function editTag(i){
  var t = S.tags[i];
  mask(true, `<h3>修改标签</h3>
    <label class="f"><span>标签名称</span><input type="text" id="et-title" value="${esc(t.title)}"></label>
    <label class="f"><span>标签 id（改它会换 URL，慎重）</span><input type="text" id="et-id" value="${esc(t.id)}"></label>
    <div class="hint">当前链接：${esc((S.settings.domain||'') + tagUrl(t.id))}</div>
    <div class="actions"><button class="btn" onclick="mask(false)">取消</button><button class="btn primary" onclick="doEditTag('${esc(t.id)}')">保存</button></div>`);
}
function doEditTag(oldId){
  api('/api/tag/save', { oldId:oldId, title:$('et-title').value.trim(), id:$('et-id').value.trim() })
    .then(function(j){ mask(false); toast(j.msg); reload().then(function(){ go('tags'); }); }).catch(fail);
}
function delTag(id){
  if(!confirm('删除标签「'+id+'」？这篇文章上的这个标签也会一起去掉。')) return;
  api('/api/tag/del', { id:id }).then(function(j){ toast(j.msg); reload().then(function(){ go('tags'); }); }).catch(fail);
}

// ---------------- 文章 ----------------
var AKW = '';
function viewArticle(){
  var list = S.article.slice().sort(function(a,b){ return b.created-a.created; });
  if(AKW) list = list.filter(function(a){ return (a.title+a.content).indexOf(AKW)>=0; });
  return `<div class="card"><h2><i class="bar"></i>文章列表 <span class="chip">${list.length} 篇</span></h2>
    <div style="display:flex;gap:10px;margin-bottom:14px">
      <input type="text" id="akw" value="${esc(AKW)}" placeholder="搜标题或正文" style="max-width:320px">
      <button class="btn" onclick="doSearch()">搜索</button>
      <div style="flex:1"></div>
      <button class="btn primary" onclick="editArticle(null)">写一篇</button>
    </div>
    ${list.length ? `<table><thead><tr><th>标题</th><th style="width:130px">栏目</th><th style="width:110px">时间</th><th style="width:210px">操作</th></tr></thead><tbody>
      ${list.map(function(a){
        var idx = S.article.indexOf(a);
        return `<tr><td><div class="t">${esc(a.title)}</div><div class="s">${esc(postUrl(a))}</div></td><td>${esc(lanmuName(a.cid))}</td><td class="s">${fmt(a.created)}</td>
        <td><a class="btn sm" href="${esc(postUrl(a))}" target="_blank">查看</a>
        <button class="btn sm" onclick="editArticle(${idx})">修改</button>
        <button class="btn sm danger" onclick="delArticle('${esc(a.id)}')">删除</button></td></tr>`;
      }).join('')}
    </tbody></table>` : '<div class="empty">还没有文章。</div>'}
  </div>`;
}
function doSearch(){ AKW = $('akw').value.trim(); go('article'); }
function editArticle(idx){
  var a = idx===null||idx===undefined ? { title:'', seo_title:'', seo_kw:'', seo_desc:'', content:'', cid:(S.lanmu[0]&&S.lanmu[0].id)||'', tags:[] } : S.article[idx];
  var opts = S.lanmu.map(function(l){ return `<option value="${esc(l.id)}" ${String(l.id)===String(a.cid)?'selected':''}>${esc(l.title)}</option>`; }).join('');
  var tagNames = (a.tags||[]).map(function(id){ for(var i=0;i<S.tags.length;i++){ if(String(S.tags[i].id)===String(id)) return S.tags[i].title; } return id; }).join(',');
  mask(true, `<h3>${idx===null||idx===undefined?'写一篇':'修改文章'}</h3>
    <label class="f"><span>标题</span><input type="text" id="a-title" value="${esc(a.title)}"></label>
    <div class="row2">
      <label class="f"><span>SEO 标题（留空用标题）</span><input type="text" id="a-seo-title" value="${esc(a.seo_title||'')}"></label>
      <label class="f"><span>栏目</span><select id="a-cid">${opts||'<option value="">（先建栏目）</option>'}</select></label>
    </div>
    <label class="f"><span>标签（逗号隔开，没建过的会自动建，id 取拼音）</span><input type="text" id="a-tags" value="${esc(tagNames)}" placeholder="人工智能,SEO,工具推荐"></label>
    <label class="f"><span>SEO 关键词</span><input type="text" id="a-kw" value="${esc(a.seo_kw||'')}"></label>
    <label class="f"><span>SEO 描述</span><textarea id="a-desc" style="min-height:60px">${esc(a.seo_desc||'')}</textarea></label>
    <label class="f"><span>正文（支持 HTML，段落用 &lt;p&gt;）</span><textarea id="a-content" style="min-height:260px;font-family:Consolas,monospace;font-size:13px">${esc(a.content||'')}</textarea></label>
    <div class="actions"><button class="btn" onclick="mask(false)">取消</button><button class="btn primary" onclick="saveArticle(${idx===null||idx===undefined?'null':idx})">保存并发布</button></div>`);
}
function saveArticle(idx){
  var a = idx===null ? null : S.article[idx];
  var body = { id: a ? a.id : undefined, title:$('a-title').value.trim(), seo_title:$('a-seo-title').value.trim(), seo_kw:$('a-kw').value.trim(), seo_desc:$('a-desc').value.trim(), content:$('a-content').value, cid:$('a-cid').value, tags:$('a-tags').value.trim() };
  api('/api/article/save', body).then(function(j){ mask(false); toast(j.msg); reload().then(function(){ go('article'); }); }).catch(fail);
}
function delArticle(id){
  var a = null; for(var i=0;i<S.article.length;i++){ if(String(S.article[i].id)===String(id)) a=S.article[i]; }
  if(!confirm('删除文章 '+(a?postUrl(a):id)+' ？')) return;
  api('/api/delete', { id:id }).then(function(j){ toast(j.msg); reload().then(function(){ go('article'); }); }).catch(fail);
}

// ---------------- 友情链接 ----------------
function viewLinks(){
  return `<div class="card"><h2><i class="bar"></i>添加友情链接</h2>
    <div class="row2" style="grid-template-columns:1fr 1fr auto;align-items:end">
      <label class="f" style="margin:0"><span>网站名称</span><input type="text" id="lk-title" placeholder="某某资源站"></label>
      <label class="f" style="margin:0"><span>网址</span><input type="text" id="lk-url" placeholder="https://example.com"></label>
      <button class="btn primary" style="height:36px" onclick="addLink()">添加</button>
    </div>
    <div class="hint">友链会显示在每页页脚，以及首页侧栏「友情链接」。</div>
  </div>
  <div class="card"><h2><i class="bar"></i>链接列表</h2>
    ${S.links.length ? `<table><thead><tr><th>名称</th><th>网址</th><th style="width:100px">操作</th></tr></thead><tbody>
      ${S.links.map(function(l,i){ return `<tr><td class="t">${esc(l.title)}</td><td><a href="${esc(l.url)}" target="_blank" rel="nofollow">${esc(l.url)}</a></td><td><button class="btn sm danger" onclick="delLink(${i})">删除</button></td></tr>`; }).join('')}
    </tbody></table>` : '<div class="empty">还没有友链。</div>'}
  </div>`;
}
function addLink(){
  api('/api/link/save', { title:$('lk-title').value.trim(), url:$('lk-url').value.trim() })
    .then(function(j){ toast(j.msg); reload().then(function(){ go('links'); }); }).catch(fail);
}
function delLink(i){
  if(!confirm('删除这条友链？')) return;
  api('/api/link/del', { index:i }).then(function(j){ toast(j.msg); reload().then(function(){ go('links'); }); }).catch(fail);
}

// ---------------- 模板管理 ----------------
var TPL_LOOK = {
  news: 'linear-gradient(135deg,#0b1220,#1e3a8a)',
  food: 'linear-gradient(135deg,#f59e0b,#ea580c)',
  blog: 'linear-gradient(135deg,#4a5148,#8d968c)'
};
function viewTemplate(){
  var cur = S.tplCur || 'news';
  var cards = (S.tpl || []).map(function(t){
    var on = t.key===cur;
    return `<div class="tplcard ${on?'on':''}">
      <div class="tplshot" style="background:${TPL_LOOK[t.key]||'#ddd'}">
        <span>${esc(t.name)}</span>
      </div>
      <div class="tplbody">
        <h3>${esc(t.name)}${on?' <em class="pill on">使用中</em>':''}</h3>
        <p>${esc(t.desc)}</p>
        <div class="tplacts">
          <a class="btn sm" href="${esc(t.preview)}" target="_blank">预览</a>
          ${on
            ? '<button class="btn sm" disabled style="opacity:.55;cursor:default">当前模板</button>'
            : `<button class="btn sm primary" onclick="switchTpl('${esc(t.key)}','${esc(t.name)}')">切换到这套</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
  return `<div class="card"><h2><i class="bar"></i>前台模板</h2>
    <div class="hint">切换后全站立即重建：首页、栏目页、文章页、标签页、搜索页一起换皮。预览会在新窗口打开，不影响现在的线上页面。</div>
    <div class="tplgrid">${cards || '<div class="empty">模板列表没加载出来。</div>'}</div>
  </div>
  <div class="card"><h2><i class="bar"></i>说明</h2>
    <table><thead><tr><th style="width:200px">模板</th><th>适合什么站</th></tr></thead><tbody>
      ${(S.tpl||[]).map(function(t){ return `<tr><td class="t">${esc(t.name)}</td><td>${esc(t.desc)}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="hint">模板切换只改 public 里的 HTML/CSS，文章数据、栏目、标签都不动，随时可以来回换。</div>
  </div>`;
}
function switchTpl(key, name){
  if(!confirm('切换到「'+name+'」并重建全站？')) return;
  api('/api/template/save', { template:key }).then(function(j){
    toast(j.msg);
    reload().then(function(){ go('template'); });
  }).catch(fail);
}

// ---------------- 通用 ----------------
function act(what){
  if(what==='rebuild'){ api('/api/rebuild', {}).then(function(j){ toast(j.msg); }).catch(fail); }
}
function fmt(ts){ var d=new Date(ts); function p(x){return (x<10?'0':'')+x;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function reload(){
  return Promise.all([
    loadSettings(),
    api('/api/list?size=200').then(function(j){ S.article = j.list || []; }),
    api('/api/tags').then(function(j){ S.tags = j.tags || []; }),
    api('/api/templates').then(function(j){ S.tpl = j.templates || []; S.tplCur = j.current; }),
  ]).catch(fail);
}
var TITLES = { dash:'概览', settings:'网站设置', template:'模板管理', lanmu:'栏目管理', tags:'标签管理', article:'文章管理', links:'友情链接' };
function go(v){
  S.cur = v;
  Array.prototype.forEach.call(document.querySelectorAll('.navitem'), function(a){ a.classList.toggle('on', a.dataset.v===v); });
  $('page-title').textContent = TITLES[v];
  if(v==='dash') $('view').innerHTML = viewDash();
  if(v==='settings') $('view').innerHTML = viewSettings();
  if(v==='template') $('view').innerHTML = viewTemplate();
  if(v==='lanmu') $('view').innerHTML = viewLanmu();
  if(v==='tags') $('view').innerHTML = viewTags();
  if(v==='article') $('view').innerHTML = viewArticle();
  if(v==='links') $('view').innerHTML = viewLinks();
  if(v==='article'){ var k=$('akw'); if(k) k.onkeydown=function(e){ if(e.key==='Enter') doSearch(); }; }
  window.scrollTo(0,0);
}

// 启动：token 来自 ?token= 或 localStorage
(function boot(){
  var q = new URLSearchParams(location.search);
  var t = q.get('token') || localStorage.getItem('ss_token') || '';
  if(t){ S.token = t; localStorage.setItem('ss_token', t); }
  if(!S.token){
    mask(true, `<h3>需要后台密钥</h3><label class="f"><span>密钥（后端 config.json 的 token）</span><input type="text" id="tk" placeholder="粘贴密钥"></label>
      <div class="actions"><button class="btn primary" onclick="var t=document.getElementById('tk').value.trim(); if(!t)return; localStorage.setItem('ss_token',t); location.reload();">进入后台</button></div>`);
    return;
  }
  document.querySelectorAll('.navitem').forEach(function(a){ a.onclick=function(){ go(a.dataset.v); }; });
  reload().then(function(){ go('dash'); });
})();
</script>
</body>
</html>
